name: 📊 Weekly Cert Tracker

on:
  schedule:
    # Weekly on Sundays at 5:00 UTC (6 PM NZT)
    - cron: '0 5 * * 0'
  workflow_dispatch:  # Manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: 📡 Fetch exam data
        run: python scripts/fetch_exams.py

      - name: 🔍 Run diff engine
        run: python scripts/diff_engine.py

      - name: 📊 Generate data files
        run: python scripts/generate_data.py

      - name: 📄 Generate study guide pages
        run: |
          export HUGO_CONTENT_DIR=/tmp/cert-pages
          mkdir -p /tmp/cert-pages
          python scripts/generate_pages.py
          python scripts/generate_enhanced_pages.py

      - name: 💾 Commit generated files
        run: |
          git config user.name "Cert Tracker Bot"
          git config user.email "cert-tracker-bot@aguidetocloud.com"
          git add site/
          git diff --cached --quiet || git commit -m "📊 Cert tracker update — $(date -u +%Y-%m-%d)" --author="Cert Tracker Bot <cert-tracker-bot@aguidetocloud.com>"
          git pull --rebase --strategy-option=theirs || (git rebase --abort && git pull --no-rebase -X theirs)
          git push || true

      - name: 🔄 Update main website with latest data
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/susanthgit/aguidetocloud-revamp.git /tmp/main-site
          mkdir -p /tmp/main-site/static/data/cert-tracker/exams
          cp site/latest.json /tmp/main-site/static/data/cert-tracker/latest.json
          cp site/rss.xml /tmp/main-site/static/data/cert-tracker/rss.xml
          cp site/exams/*.json /tmp/main-site/static/data/cert-tracker/exams/
          # Copy generated content pages (only non-manual pages — manual pages already in repo)
          for f in /tmp/cert-pages/*.md; do
            if [ -f "$f" ]; then
              basename=$(basename "$f")
              target="/tmp/main-site/content/cert-tracker/$basename"
              # Only copy if target doesn't have manual: true
              if [ -f "$target" ] && grep -q "manual: true" "$target"; then
                echo "Skipping manual page: $basename"
              else
                cp "$f" "$target"
              fi
            fi
          done
          cd /tmp/main-site
          git config user.name "Cert Tracker Bot"
          git config user.email "cert-tracker-bot@aguidetocloud.com"
          git add static/data/cert-tracker/ content/cert-tracker/
          git diff --cached --quiet || git commit -m "📊 Cert tracker data + pages update — $(date -u +%Y-%m-%d)"
          git push

      # Git push above triggers Cloudflare Pages auto-build — no manual deploy needed

  notify-on-failure:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    needs: fetch-and-deploy
    if: failure()
    steps:
      - name: 🚨 Create failure issue
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          gh issue create \
            --repo susanthgit/cert-tracker \
            --title "🚨 Cert tracker pipeline failed — $(date -u +%Y-%m-%d)" \
            --body "The weekly Cert Tracker workflow failed. Check the [workflow run](https://github.com/susanthgit/cert-tracker/actions) for details." \
